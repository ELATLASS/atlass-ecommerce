name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2
        with:
          fetch-depth: 0  # Required for changelog generation

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.7.0
        with:
          python-version: '3.11'

      - name: Generate tag + release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYEOF'
          import subprocess, os, datetime, re

          # Build a unique tag: v{YYYY.MM.DD}.{short_sha}
          sha = subprocess.check_output(["git", "rev-parse", "--short=8", "HEAD"]).decode().strip()
          date_str = datetime.datetime.utcnow().strftime("%Y.%m.%d")
          tag_name = f"v{date_str}.{sha}"

          # Check if tag already exists
          tags = subprocess.check_output(["git", "tag", "-l"]).decode().strip().split("\n")
          if tag_name in tags:
              print(f"Tag {tag_name} already exists, incrementing...")
              tag_name = f"v{date_str}.{sha}.1"

          print(f"::set-output name=tag::{tag_name}")
          with open(os.environ.get("GITHUB_OUTPUT", "/tmp/github_output"), "a") as f:
              f.write(f"tag={tag_name}\n")
          PYEOF
        id: generate_tag

      - name: Create Release
        uses: softprops/action-gh-release@a4682c0d9c5e6a8e1a7b4b8e3c2d1a0b9c8d7e6f # v2.2.0
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag }}
          name: ${{ steps.generate_tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false