name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a2d1cbb0c7eab3e3e9e955f1e6e5f4a0b0c0d0e0 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@11545c3a09f4103a3c4eda0c61970dcb611e3d28 # v5.7.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 ruff
      - name: Lint Python
        run: |
          ruff check *.py --exit-non-zero-on-fix

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@a2d1cbb0c7eab3e3e9e955f1e6e5f4a0b0c0d0e0 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@115c3a09f4103a3c4eda0c6170dcb611e3d28 # v5.7.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          python -m pytest tests/ -v

  deploy:
    name: Deploy check
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@a2d1cbb0c7eab3e3e9e955f1e6e5f4a0b0c0d0e0 # v4.2.2
      - name: Deploy
        run: echo "Deployment ready for main branch"